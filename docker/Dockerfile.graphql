FROM node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293 AS build
WORKDIR /app
COPY graphql-server/package.json ./
RUN npm install --no-audit --no-fund
COPY graphql-server/tsconfig.json ./
COPY graphql-server/src ./src
# Compile, then drop devDependencies in the same layer so the runtime stage can
# copy a production-only node_modules tree instead of running npm again.
RUN npm run build && npm prune --omit=dev

FROM node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293 AS runtime
WORKDIR /app
ENV NODE_ENV=production
# Only the compiled output and production dependencies reach the runtime image:
# no npm cache, no registry metadata, no TypeScript toolchain.
COPY --from=build --chown=node:node /app/package.json ./package.json
COPY --from=build --chown=node:node /app/node_modules ./node_modules
COPY --from=build --chown=node:node /app/dist ./dist
COPY --chown=node:node db ./db
USER node
EXPOSE 4000
CMD ["node", "dist/index.js"]
