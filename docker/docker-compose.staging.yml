version: "3.9"

services:
  # PostgreSQL — stores indexed Stellar network data (staging)
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumina_staging
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-lumina_staging_dev}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-}
      LUMINA_GRAPHQL_PASSWORD: ${STAGING_LUMINA_GRAPHQL_PASSWORD:-lumina_graphql_staging}
      LUMINA_INDEXER_PASSWORD: ${STAGING_LUMINA_INDEXER_PASSWORD:-lumina_indexer_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./initdb/03_roles.sh:/docker-entrypoint-initdb.d/03_roles.sh:ro
      - ../db/roles.sql:/opt/lumina/db/roles.sql:ro
      - ../db/verify_roles.sql:/opt/lumina/db/verify_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Lumina Indexer — polls Horizon and writes to PostgreSQL (staging)
  indexer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lumina_indexer:${STAGING_LUMINA_INDEXER_PASSWORD:-lumina_indexer_staging}@postgres:5432/lumina_staging
      HORIZON_URL: ${STAGING_HORIZON_URL:-https://horizon-testnet.stellar.org}
      POLL_INTERVAL_MS: "5000"
      HORIZON_MIN_REQUEST_INTERVAL_MS: "1000"
      START_LEDGER: ${STAGING_START_LEDGER:-}
      SOROBAN_RPC_URL: ${STAGING_SOROBAN_RPC_URL:-}
      INDEXED_CONTRACT_IDS: ${STAGING_INDEXED_CONTRACT_IDS:-}
      REGISTRY_CONTRACT_ID: ${STAGING_REGISTRY_CONTRACT_ID:-}
      REGISTRY_READ_ACCOUNT: ${STAGING_REGISTRY_READ_ACCOUNT:-}
      HEALTH_PORT: "9090"
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Lumina GraphQL Server — serves indexed data via GraphQL API (staging)
  graphql:
    build:
      context: ..
      dockerfile: docker/Dockerfile.graphql
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lumina_graphql:${STAGING_LUMINA_GRAPHQL_PASSWORD:-lumina_graphql_staging}@postgres:5432/lumina_staging
      PORT: "4000"
      S3_EXPORT_BUCKET: ${STAGING_S3_EXPORT_BUCKET:-}
      S3_EXPORT_PREFIX: ${STAGING_S3_EXPORT_PREFIX:-lumina-staging/exports}
      S3_EXPORT_INTERVAL_MS: ${STAGING_S3_EXPORT_INTERVAL_MS:-86400000}
      S3_EXPORT_RETENTION_DAYS: ${STAGING_S3_EXPORT_RETENTION_DAYS:-30}
      S3_ENDPOINT: ${STAGING_S3_ENDPOINT:-}
      S3_REGION: ${STAGING_S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${STAGING_S3_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${STAGING_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${STAGING_AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${STAGING_AWS_SESSION_TOKEN:-}
    ports:
      - "127.0.0.1:4001:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_staging_data:
