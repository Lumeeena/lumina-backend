# Docker json-file wrapper. The application line is in `log`, so the time here
# is the container runtime's, which is dropped in favour of the application's.
[PARSER]
    Name         docker
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep    Off

# A pino line. `time` is pino's ISO-8601 UTC timestamp (see logger.ts), which is
# the event time, so it is kept as the record's timestamp.
[PARSER]
    Name         lumina_json
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep    On
