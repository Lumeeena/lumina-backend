# Lumina log shipping: a template, not a deployment.
#
# Reads the container runtime's JSON log files, keeps only the Lumina services,
# parses each pino line, maps the numeric level to a name, and forwards it.
# The application is unaware of this file. See docs/LOG_SHIPPING.md.
#
# Check the syntax against your Fluent Bit version before deploying:
#   fluent-bit --dry-run -c fluent-bit.conf -R parsers.conf

[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  parsers.conf

# Docker's json-file driver writes one wrapper object per line, with the
# application's line in its `log` field. Position is remembered in DB so a
# restart does not re-ship the whole file.
[INPUT]
    Name           tail
    Tag            docker.*
    Path           /var/lib/docker/containers/*/*-json.log
    Parser         docker
    DB             /var/log/flb_lumina_positions.db
    Mem_Buf_Limit  50MB
    Skip_Long_Lines On

# Keep only Lumina service lines, identified by the field pino always writes.
[FILTER]
    Name   grep
    Match  docker.*
    Regex  log "service":"lumina-

# Parse the application's JSON line into top-level fields.
[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     log
    Parser       lumina_json
    Reserve_Data On
    Preserve_Key Off

# pino emits numeric levels (30 = info). Map them to names for the aggregator.
[FILTER]
    Name    lua
    Match   docker.*
    script  level_names.lua
    call    map_level

# Local check: print what would be shipped. Replace with an aggregator output.
[OUTPUT]
    Name    stdout
    Match   docker.*
    Format  json_lines

# Example aggregator output (Grafana Loki). Uncomment, set the host, and keep
# the labels low-cardinality: see "Fields to index" in docs/LOG_SHIPPING.md.
#
# [OUTPUT]
#     Name        loki
#     Match       docker.*
#     Host        loki.example.internal
#     Port        3100
#     Labels      job=lumina
#     Label_Keys  $service,$subsystem,$network
