version: "3.9"

services:
  # PostgreSQL — stores indexed Stellar network data
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumina
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina_dev
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-}
      # Consumed by docker/initdb/03_roles.sh when it applies db/roles.sql. The
      # two service DATABASE_URLs below are built from the same values, so
      # changing one here changes both ends.
      LUMINA_GRAPHQL_PASSWORD: ${LUMINA_GRAPHQL_PASSWORD:-lumina_graphql_dev}
      LUMINA_INDEXER_PASSWORD: ${LUMINA_INDEXER_PASSWORD:-lumina_indexer_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      # Runs last: creates lumina_owner/lumina_graphql/lumina_indexer, moves
      # ownership, and applies the grants. Wrapped in a .sh because db/roles.sql
      # needs psql variables the .sql init path cannot pass. Mounted outside
      # docker-entrypoint-initdb.d so the entrypoint does not also try to run it
      # bare (it refuses to run without passwords).
      - ./initdb/03_roles.sh:/docker-entrypoint-initdb.d/03_roles.sh:ro
      - ../db/roles.sql:/opt/lumina/db/roles.sql:ro
      - ../db/verify_roles.sql:/opt/lumina/db/verify_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Lumina Indexer — polls Horizon and writes to PostgreSQL
  indexer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Least-privilege login: DML on the indexed tables, no DDL. See
      # docs/DATABASE_ROLES.md.
      DATABASE_URL: postgresql://lumina_indexer:${LUMINA_INDEXER_PASSWORD:-lumina_indexer_dev}@postgres:5432/lumina
      HORIZON_URL: https://horizon.stellar.org
      POLL_INTERVAL_MS: "5000"
      # Conservative pacing for anonymous public Horizon access — its
      # sustained per-IP rate limit is much lower than a burst-only throttle
      # accounts for (confirmed live: even 10 req/sec sustained 429'd).
      HORIZON_MIN_REQUEST_INTERVAL_MS: "1000"
      # Uncomment to start from a specific ledger:
      # START_LEDGER: "52000000"
      # Soroban contract event indexing — enabled by default, pointed at the
      # deployed testnet Lumina Registry (see contracts/DEPLOY.md in
      # lumina-contracts). Unset these to disable event indexing entirely.
      SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
      INDEXED_CONTRACT_IDS: "CAYUDQPV3RKPM3EXDFGI3457FV677JLUCJ4OLKWGCUBPRIHYKXK3WFAZ"
      REGISTRY_CONTRACT_ID: "CAYUDQPV3RKPM3EXDFGI3457FV677JLUCJ4OLKWGCUBPRIHYKXK3WFAZ"
      REGISTRY_READ_ACCOUNT: "GBWKFFXZ5CJESIHP2EOID5IOXMF472RO5XOJ36X475D5LJGI3AF5R5KY"
      HEALTH_PORT: "9090"
    expose:
      - "9090"
    # Health here means *progress*, not liveness: `/health` answers 503 once no
    # ledger has been indexed for HEALTH_MAX_SECONDS_SINCE_INDEX. A wedged
    # polling loop is the failure that actually happens, and to `docker ps` it
    # is indistinguishable from a healthy one without this.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Generous, because a cold start reads Horizon's tip before it can index
      # anything and should not be killed while doing so.
      start_period: 60s

  # Lumina GraphQL Server — serves indexed data via GraphQL API
  graphql:
    build:
      context: ..
      dockerfile: docker/Dockerfile.graphql
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Read-only login: SELECT + LISTEN. See docs/DATABASE_ROLES.md.
      DATABASE_URL: postgresql://lumina_graphql:${LUMINA_GRAPHQL_PASSWORD:-lumina_graphql_dev}@postgres:5432/lumina
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Observability stack ──────────────────────────────────────────────────
  #
  # Opt-in, so the default `docker compose up` stays the three services it has
  # always been:
  #
  #   docker compose -f docker/docker-compose.yml --profile observability up
  #
  # Grafana lands on http://localhost:3001 (admin/admin) with the Lumina
  # dashboard already provisioned.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - indexer
      - graphql
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/lumina.yml:ro
      - ./observability/lumina-dashboard.json:/var/lib/grafana/dashboards/lumina-dashboard.json:ro
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  postgres_data:
