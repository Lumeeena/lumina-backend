# ─── Effects (#225) ──────────────────────────────────────────────────────────

"""
One change an operation made to one account, as Horizon's /effects reports it.

Amounts are decimal strings and assets are one string, `"XLM"` for native or
`"CODE:ISSUER"`, the same conventions as `Operation`.
"""
type Effect {
  """Horizon's effect id, `<operation id>-<order>`; unique within its network."""
  id: String!
  """Horizon's paging token for this effect."""
  pagingToken: String!
  """Account the effect happened to."""
  account: String!
  """
  Horizon's effect type name, e.g. `account_credited`. A plain string rather
  than `EffectType` so a type newer than this server still comes through;
  filter with `effects(type:)`.
  """
  type: String!
  """Horizon's numeric code for `type`."""
  typeId: Int!
  """The operation that produced this effect."""
  operationId: String!
  """Ledger the operation closed in."""
  ledger: Int!
  """When that ledger closed (ISO-8601)."""
  createdAt: String!
  """
  The type-specific fields, typed per effect type. Null for the types Horizon
  gives no fields of their own: `account_removed`,
  `account_inflation_destination_updated` and the `offer_*` types.
  """
  details: EffectDetails
}

"""
A page of effects, newest first.
"""
type EffectPage {
  """The effects on this page."""
  items: [Effect!]!
  """Where to resume; see `PageInfo`."""
  pageInfo: PageInfo!
}

"""
An effect type, Horizon's name upper-cased (`account_credited` is `ACCOUNT_CREDITED`).
"""
enum EffectType {
  """A new account was created and funded."""
  ACCOUNT_CREATED
  """The account was merged away."""
  ACCOUNT_REMOVED
  """The account received an asset."""
  ACCOUNT_CREDITED
  """The account sent an asset."""
  ACCOUNT_DEBITED
  """The account's signature thresholds changed."""
  ACCOUNT_THRESHOLDS_UPDATED
  """The account's home domain changed."""
  ACCOUNT_HOME_DOMAIN_UPDATED
  """The account's authorization flags changed."""
  ACCOUNT_FLAGS_UPDATED
  """The account's inflation destination changed (inflation is retired)."""
  ACCOUNT_INFLATION_DESTINATION_UPDATED
  """A signer was added to the account."""
  SIGNER_CREATED
  """A signer was removed from the account."""
  SIGNER_REMOVED
  """A signer's weight changed."""
  SIGNER_UPDATED
  """The account added a trustline."""
  TRUSTLINE_CREATED
  """The account removed a trustline."""
  TRUSTLINE_REMOVED
  """A trustline's limit changed."""
  TRUSTLINE_UPDATED
  """The issuer authorized a trustline (legacy effect)."""
  TRUSTLINE_AUTHORIZED
  """The issuer deauthorized a trustline (legacy effect)."""
  TRUSTLINE_DEAUTHORIZED
  """The issuer authorized a trustline to maintain liabilities only (legacy effect)."""
  TRUSTLINE_AUTHORIZED_TO_MAINTAIN_LIABILITIES
  """The issuer changed a trustline's flags."""
  TRUSTLINE_FLAGS_UPDATED
  """An offer was created (Horizon no longer emits this)."""
  OFFER_CREATED
  """An offer was removed (Horizon no longer emits this)."""
  OFFER_REMOVED
  """An offer was updated (Horizon no longer emits this)."""
  OFFER_UPDATED
  """An offer was crossed on the DEX."""
  TRADE
  """A data entry was added."""
  DATA_CREATED
  """A data entry was removed."""
  DATA_REMOVED
  """A data entry's value changed."""
  DATA_UPDATED
  """The account's sequence number was bumped."""
  SEQUENCE_BUMPED
  """A claimable balance was created."""
  CLAIMABLE_BALANCE_CREATED
  """The account was named a claimant of a claimable balance."""
  CLAIMABLE_BALANCE_CLAIMANT_CREATED
  """The account claimed a claimable balance."""
  CLAIMABLE_BALANCE_CLAIMED
  """The issuer clawed back a claimable balance."""
  CLAIMABLE_BALANCE_CLAWED_BACK
  """The account's reserve became sponsored."""
  ACCOUNT_SPONSORSHIP_CREATED
  """The account's reserve sponsor changed."""
  ACCOUNT_SPONSORSHIP_UPDATED
  """The account's reserve is no longer sponsored."""
  ACCOUNT_SPONSORSHIP_REMOVED
  """A trustline's reserve became sponsored."""
  TRUSTLINE_SPONSORSHIP_CREATED
  """A trustline's reserve sponsor changed."""
  TRUSTLINE_SPONSORSHIP_UPDATED
  """A trustline's reserve is no longer sponsored."""
  TRUSTLINE_SPONSORSHIP_REMOVED
  """A data entry's reserve became sponsored."""
  DATA_SPONSORSHIP_CREATED
  """A data entry's reserve sponsor changed."""
  DATA_SPONSORSHIP_UPDATED
  """A data entry's reserve is no longer sponsored."""
  DATA_SPONSORSHIP_REMOVED
  """A claimable balance's reserve became sponsored."""
  CLAIMABLE_BALANCE_SPONSORSHIP_CREATED
  """A claimable balance's reserve sponsor changed."""
  CLAIMABLE_BALANCE_SPONSORSHIP_UPDATED
  """A claimable balance's reserve is no longer sponsored."""
  CLAIMABLE_BALANCE_SPONSORSHIP_REMOVED
  """A signer's reserve became sponsored."""
  SIGNER_SPONSORSHIP_CREATED
  """A signer's reserve sponsor changed."""
  SIGNER_SPONSORSHIP_UPDATED
  """A signer's reserve is no longer sponsored."""
  SIGNER_SPONSORSHIP_REMOVED
  """The account deposited into a liquidity pool."""
  LIQUIDITY_POOL_DEPOSITED
  """The account withdrew from a liquidity pool."""
  LIQUIDITY_POOL_WITHDREW
  """A liquidity pool was traded against."""
  LIQUIDITY_POOL_TRADE
  """A liquidity pool was created."""
  LIQUIDITY_POOL_CREATED
  """A liquidity pool was removed."""
  LIQUIDITY_POOL_REMOVED
  """The issuer revoked the account's pool shares."""
  LIQUIDITY_POOL_REVOKED
  """A contract received an asset (Stellar Asset Contract)."""
  CONTRACT_CREDITED
  """A contract sent an asset (Stellar Asset Contract)."""
  CONTRACT_DEBITED
}

"""
The type-specific fields of an effect, one member per shape. Effect types
with the same fields share a member (`account_credited` and `account_debited`
are both `AccountBalanceEffectDetails`); read `Effect.type` for which one.
A type this server does not map yet comes through as `UnrecognizedEffectDetails`.
Fields Horizon left out are null.
"""
union EffectDetails =
    AccountCreatedEffectDetails
  | AccountBalanceEffectDetails
  | ContractBalanceEffectDetails
  | AccountThresholdsEffectDetails
  | AccountHomeDomainEffectDetails
  | AccountFlagsEffectDetails
  | SignerEffectDetails
  | TrustlineEffectDetails
  | TrustlineAuthorizationEffectDetails
  | TradeEffectDetails
  | DataEffectDetails
  | SequenceBumpedEffectDetails
  | ClaimableBalanceEffectDetails
  | SponsorshipEffectDetails
  | LiquidityPoolEffectDetails
  | UnrecognizedEffectDetails

"""`account_created`."""
type AccountCreatedEffectDetails {
  """XLM the new account was funded with, as a decimal string."""
  startingBalance: String
}

"""`account_credited`, `account_debited`."""
type AccountBalanceEffectDetails {
  """Amount moved, as a decimal string."""
  amount: String
  """Asset moved; null for a liquidity pool share."""
  asset: String
}

"""`contract_credited`, `contract_debited`."""
type ContractBalanceEffectDetails {
  """Contract the asset moved to or from."""
  contract: String
  """Amount moved, as a decimal string."""
  amount: String
  """Asset moved."""
  asset: String
}

"""`account_thresholds_updated`."""
type AccountThresholdsEffectDetails {
  """New low threshold."""
  lowThreshold: Int
  """New medium threshold."""
  medThreshold: Int
  """New high threshold."""
  highThreshold: Int
}

"""`account_home_domain_updated`."""
type AccountHomeDomainEffectDetails {
  """New home domain; empty when it was cleared."""
  homeDomain: String
}

"""`account_flags_updated`. Only the flags the operation changed are set."""
type AccountFlagsEffectDetails {
  """New `auth_required` value."""
  authRequired: Boolean
  """New `auth_revocable` value."""
  authRevocable: Boolean
  """New `auth_immutable` value."""
  authImmutable: Boolean
  """New `auth_clawback_enabled` value."""
  authClawbackEnabled: Boolean
}

"""`signer_created`, `signer_removed`, `signer_updated`."""
type SignerEffectDetails {
  """Signer's public key."""
  publicKey: String
  """Signer key as Horizon reports it (same as `publicKey` for ed25519 signers)."""
  key: String
  """Signer weight after the change; 0 when removed."""
  weight: Int
}

"""`trustline_created`, `trustline_removed`, `trustline_updated`."""
type TrustlineEffectDetails {
  """Asset the trustline is for; null for a liquidity pool share."""
  asset: String
  """Trustline limit, as a decimal string."""
  limit: String
  """Pool, when the trustline is for liquidity pool shares."""
  liquidityPoolId: String
}

"""
`trustline_flags_updated`, and the legacy `trustline_authorized`,
`trustline_deauthorized` and `trustline_authorized_to_maintain_liabilities`.
The legacy types report through their name what they set; it is filled in here.
"""
type TrustlineAuthorizationEffectDetails {
  """Account whose trustline changed."""
  trustor: String
  """Asset of the trustline."""
  asset: String
  """Whether the trustline is now authorized; null when unchanged."""
  authorized: Boolean
  """Whether it may now only maintain liabilities; null when unchanged."""
  authorizedToMaintainLiabilities: Boolean
  """Whether clawback is now enabled on it; null when unchanged."""
  clawbackEnabled: Boolean
}

"""`trade`: one offer crossed, from this account's side."""
type TradeEffectDetails {
  """Account on the other side of the trade."""
  seller: String
  """Offer that was crossed."""
  offerId: String
  """Amount this account sold, as a decimal string."""
  soldAmount: String
  """Asset this account sold."""
  soldAsset: String
  """Amount this account bought, as a decimal string."""
  boughtAmount: String
  """Asset this account bought."""
  boughtAsset: String
}

"""`data_created`, `data_removed`, `data_updated`."""
type DataEffectDetails {
  """Data entry name."""
  name: String
  """Data entry value, base64-encoded; null when removed."""
  value: String
}

"""`sequence_bumped`."""
type SequenceBumpedEffectDetails {
  """New sequence number, as a string (it can exceed 2^53)."""
  newSequence: String
}

"""
`claimable_balance_created`, `claimable_balance_claimant_created`,
`claimable_balance_claimed`, `claimable_balance_clawed_back`.
"""
type ClaimableBalanceEffectDetails {
  """Claimable balance id."""
  balanceId: String
  """Asset held by the balance."""
  asset: String
  """Amount, as a decimal string."""
  amount: String
  """
  `claimable_balance_claimant_created`: the claim predicate, JSON-encoded as
  Horizon reports it (a predicate nests `and` / `or` / `not` arbitrarily deep).
  """
  predicate: String
}

"""
Every `*_sponsorship_created`, `*_sponsorship_updated` and
`*_sponsorship_removed` type. `Effect.type` says what is sponsored; the
matching field names it.
"""
type SponsorshipEffectDetails {
  """Sponsor, on a `_created` effect."""
  sponsor: String
  """Previous sponsor, on an `_updated` or `_removed` effect."""
  formerSponsor: String
  """New sponsor, on an `_updated` effect."""
  newSponsor: String
  """Signer whose reserve is sponsored (`signer_sponsorship_*`)."""
  signer: String
  """Data entry whose reserve is sponsored (`data_sponsorship_*`)."""
  dataName: String
  """Trustline asset whose reserve is sponsored (`trustline_sponsorship_*`)."""
  asset: String
  """Pool-share trustline whose reserve is sponsored (`trustline_sponsorship_*`)."""
  liquidityPoolId: String
  """Claimable balance whose reserve is sponsored (`claimable_balance_sponsorship_*`)."""
  balanceId: String
}

"""An asset and an amount of it."""
type EffectAssetAmount {
  """Asset."""
  asset: String
  """Amount, as a decimal string."""
  amount: String
  """`liquidity_pool_revoked`: claimable balance the revoked reserve was moved into."""
  claimableBalanceId: String
}

"""
`liquidity_pool_deposited`, `_withdrew`, `_trade`, `_created`, `_removed`,
`_revoked`. Pool state (`feeBp`, `totalShares`, `reserves`) is after the effect.
"""
type LiquidityPoolEffectDetails {
  """Pool id."""
  liquidityPoolId: String
  """Pool fee in basis points."""
  feeBp: Int
  """Total pool shares, as a decimal string."""
  totalShares: String
  """Number of trustlines to the pool's shares."""
  totalTrustlines: String
  """Pool reserves."""
  reserves: [EffectAssetAmount!]
  """`_deposited`: reserves this account put in."""
  reservesDeposited: [EffectAssetAmount!]
  """`_withdrew`: reserves this account took out."""
  reservesReceived: [EffectAssetAmount!]
  """`_revoked`: reserves moved out of the pool when the shares were revoked."""
  reservesRevoked: [EffectAssetAmount!]
  """`_deposited`: shares received, as a decimal string."""
  sharesReceived: String
  """`_withdrew`: shares redeemed, as a decimal string."""
  sharesRedeemed: String
  """`_revoked`: shares revoked, as a decimal string."""
  sharesRevoked: String
  """`_trade`: what the pool sold."""
  sold: EffectAssetAmount
  """`_trade`: what the pool bought."""
  bought: EffectAssetAmount
}

"""An effect type this server does not map yet, with Horizon's fields as they are."""
type UnrecognizedEffectDetails {
  """Horizon's type-specific fields, JSON-encoded."""
  raw: String!
}

# ─── Signers & Sponsorship (#226) ────────────────────────────────────────────

"""
One signer on a Stellar account.

The `key` is the signer's public key (`G...` for ed25519) or pre-auth
transaction hash / hash-x hash. `weight` contributes to the account's
signature threshold.
"""
type Signer {
  """Signer public key or hash."""
  key: String!
  """Signer type: `ed25519_public_key`, `preauth_tx`, or `hash_x`."""
  type: String!
  """Signature weight this signer contributes."""
  weight: Int!
}

"""
Sponsorship relationship: an account sponsoring reserves for another account's
entries.
"""
type Sponsorship {
  """The sponsoring account (pays reserves)."""
  sponsoringId: String!
  """The sponsored account (receives reserves)."""
  sponsoredId: String!
  """Ledger this sponsorship was last modified in."""
  lastModifiedLedger: Int!
}

# ─── Contracts & Deployments (#227) ──────────────────────────────────────────

"""
A deployed Soroban contract and its on-chain deployment metadata.
"""
type ContractDeployment {
  """Contract address (`C...`)."""
  contractId: String!
  """Account that deployed the contract."""
  deployer: String!
  """Wasm hash of the deployed contract code."""
  wasmHash: String!
  """Ledger the contract was deployed in."""
  deployedLedger: Int!
  """Timestamp of the deployment ledger."""
  deployedAt: String!
  """Other contracts sharing the same wasm code."""
  sharedWasmContracts(
    limit: Int = 10
  ): [ContractDeployment!]
}

# ─── Network Statistics (#228) ───────────────────────────────────────────────

"""
Network-level activity statistics for a time period, computed from rollups.
"""
type NetworkStats {
  """Period start (ISO 8601)."""
  periodStart: String!
  """Period end (ISO 8601)."""
  periodEnd: String!
  """Bucket granularity: `hour` or `day`."""
  granularity: String!
  """Total transactions in the period."""
  transactionCount: Int!
  """Total operations in the period."""
  operationCount: Int!
  """Number of distinct active accounts."""
  activeAccounts: Int!
  """Total volume moved (stroops, as string)."""
  totalVolume: String!
}

"""
A single time bucket for charting network statistics.
"""
type NetworkStatsBucket {
  """Bucket start time (ISO 8601)."""
  bucketStart: String!
  """Transactions in this bucket."""
  transactionCount: Int!
  """Operations in this bucket."""
  operationCount: Int!
  """Distinct active accounts in this bucket."""
  activeAccounts: Int!
  """Total volume in this bucket (stroops)."""
  totalVolume: String!
}

# ─── Activity Rollups (#229) ─────────────────────────────────────────────────

"""
A rolled-up activity aggregate for a time bucket.
"""
type ActivityRollup {
  """Bucket start time (ISO 8601)."""
  bucketStart: String!
  """Bucket granularity: `hour` or `day`."""
  granularity: String!
  """Network name."""
  network: String!
  """Transactions in this bucket."""
  transactionCount: Int!
  """Operations in this bucket."""
  operationCount: Int!
  """Distinct active accounts in this bucket."""
  activeAccounts: Int!
  """Total volume in this bucket (stroops)."""
  totalVolume: String!
}

# ─── Query additions ─────────────────────────────────────────────────────────

extend type Query {
  """
  Account signers and sponsorship details (#226).
  """
  accountSigners(address: String!): [Signer!]!

  """
  Accounts sponsored by the given address (#226).
  """
  sponsoredAccounts(
    """Issuing address whose sponsored accounts to list."""
    sponsorAddress: String!
    """
    Maximum accounts to return. Capped at 1000 so a single sponsor cannot force
    an unbounded response; use a narrower sponsor rather than raising this.
    """
    limit: Int = 1000
  ): [Account!]!

  """
  Resolve a contract ID to its deployment details (#227).
  """
  contract(contractId: String!): ContractDeployment

  """
  List deployed contracts, newest first (#227).
  """
  contracts(limit: Int = 20, cursor: String): [ContractDeployment!]!

  """
  Network statistics for a time period, computed from rollups (#228).
  """
  networkStats(
    """Start of the range (ISO 8601), inclusive."""
    startTime: String!
    """End of the range (ISO 8601), exclusive."""
    endTime: String!
    """Bucket width: `hour` or `day`."""
    granularity: String = "hour"
    """
    Maximum buckets to return, capped at 1000. A range that would exceed the
    cap returns an error rather than a silently truncated series.
    """
    limit: Int = 1000
  ): [NetworkStatsBucket!]!

  """
  Rolled-up activity aggregates (#229).
  """
  activityRollups(
    """Network whose rollups to read."""
    network: String!
    """Bucket width: `hour` or `day`."""
    granularity: String = "hour"
    """Start of the range (ISO 8601), inclusive."""
    startTime: String!
    """End of the range (ISO 8601), exclusive."""
    endTime: String!
    """
    Maximum buckets to return, capped at 1000. A range that would exceed the
    cap returns an error rather than a silently truncated series.
    """
    limit: Int = 1000
  ): [ActivityRollup!]!
}
