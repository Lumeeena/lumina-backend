name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository:
    name: Repository Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      # Only these authors may change files that run code on install, commit or
      # folder open.
      TRUSTED_AUTHORS: DeborahOlaboye
      PROTECTED: '^(\.github/|\.gitignore$|\.vscode/|\.husky/|\.devcontainer/|\.npmrc$|\.yarnrc|\.yarn/|\.pnpmfile\.cjs$|scripts/prepare\.mjs$)'
      LIFECYCLE: '"(preinstall|install|postinstall|preprepare|prepare|postprepare|prepublish|prepublishOnly|prepack|postpack)"[[:space:]]*:'
    steps:
      - uses: actions/checkout@v4
      - name: Check for editor tasks and disallowed paths
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.vscode/(tasks|launch)\.json$|(^|/)dist/setup\.js$|(^|/)fa-solid-(300|500|600)[^/]*$|(^|/)fa-solid\.[^/]+$|\.(lfk|lkf|llf)$' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS= read -r f; do echo "::error file=$f::path not allowed in this repository"; done
            exit 1
          fi
      # Every font must start with its format's signature, so a script renamed
      # to a font extension cannot pass as an asset.
      - name: Check font files are real fonts
        run: |
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            ok=
            sig=$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')
            case "${f##*.}" in
              woff2|WOFF2) ok=$([ "$sig" = 774f4632 ] && echo y) ;;
              woff|WOFF)   ok=$([ "$sig" = 774f4646 ] && echo y) ;;
              ttf|TTF|otf|OTF) case "$sig" in 00010000|74727565|4f54544f) ok=y ;; esac ;;
              eot|EOT)     ok=$([ "$(head -c 36 "$f" | tail -c 2)" = LP ] && echo y) ;;
            esac
            if [ -z "$ok" ]; then echo "::error file=$f::not a valid font file"; fail=1; fi
          done < <(git ls-files | grep -iE '\.(woff2?|ttf|otf|eot)$')
          exit $fail
      # npm runs lifecycle scripts on install. Existing ones stay; a pull
      # request may not add or change one.
      - name: Check install hooks are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --no-tags --depth=1 origin "$BASE_SHA"
          fail=0
          for f in $(git ls-files '*package.json'); do
            head_hooks=$(grep -E "$LIFECYCLE" "$f" | tr -s '[:space:]' ' ' | sort)
            base_hooks=$(git show "$BASE_SHA:$f" 2>/dev/null | grep -E "$LIFECYCLE" | tr -s '[:space:]' ' ' | sort)
            if [ "$head_hooks" != "$base_hooks" ]; then
              echo "::error file=$f::install hook added or changed"; fail=1
            fi
          done
          exit $fail
      - name: Check package scripts
        run: |
          bad=$(git ls-files '*package.json' | xargs -r grep -lE 'node +api\.js|dist/setup\.js|curl |wget |base64 -d' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS= read -r f; do echo "::error file=$f::package script downloads or runs unexpected code"; done
            exit 1
          fi
      # Code appended after `export default`, behind a long run of blank space
      # or on one very long line, is easy to miss in review.
      - name: Check config files for appended code
        run: |
          fail=0
          for f in $(git ls-files | grep -E '(^|/)(postcss|tailwind|eslint|next|jest|vite|vitest|webpack|babel|prettier)\.config\.[cm]?[jt]s$|(^|/)\.eslintrc'); do
            if awk 'length > 500 { exit 1 }' "$f" && ! grep -qE '[[:space:]]{200,}' "$f"; then continue; fi
            echo "::error file=$f::very long line or large blank gap"; fail=1
          done
          exit $fail
      # .github/ is excluded because this file names the strings itself; the
      # protected-files step covers it instead.
      - name: Check for known malicious strings
        run: |
          bad=$(git grep -lF -e 'rmcej%otb%' -e 'Cot%3t=shtP' -e '_$_1e42' -e 'folderOpen' -e 'allowAutomaticTasks' -- ':!.github/' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS= read -r f; do echo "::error file=$f::known malicious string or editor auto-run setting"; done
            exit 1
          fi
      - name: Check protected files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case " $TRUSTED_AUTHORS " in *" $AUTHOR "*) exit 0;; esac
          bad=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' | grep -E "$PROTECTED" || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS= read -r f; do echo "::error file=$f::only a maintainer may change this file"; done
            exit 1
          fi

  indexer:
    name: Build Indexer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --workspace @lumina/indexer
        working-directory: .
      - run: npm run lint
      - run: npm run build
      - run: npm test

  graphql-server:
    name: Build GraphQL Server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: graphql-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --workspace @lumina/graphql-server
        working-directory: .
      - run: npm run lint
      - run: npm run schema:check
      - run: npm run build
      - run: npm test

  client:
    name: TypeScript client (@lumina/client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --workspace @lumina/client
        working-directory: .
      # Regenerates from graphql-server/src/schema.graphql and fails when the
      # committed client differs: a schema change must ship with its client.
      - run: npm run check
      - run: npm run build
      - run: npm test

  db-lint:
    name: Validate SQL Schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: lumina_test
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: psql postgresql://lumina:lumina_test@localhost:5432/lumina_test -f db/schema.sql

  db-schema-parity:
    name: Verify DB Schema Parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lumina_test
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Builds one database from db/schema.sql and another by replaying
      # every file in db/migrations/, then diffs the normalized dumps.
      - run: ./db/check-schema-parity.sh
        env:
          PARITY_BASE_URL: postgresql://lumina:lumina_test@localhost:5432/postgres

  subscriptions:
    name: Integration (live Postgres)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    # A hung test must fail fast rather than sit until the six-hour default.
    # This job did exactly that: every test passed and the process then refused
    # to exit, because a leaked Postgres connection kept the event loop alive.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: lumina_test
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: psql postgresql://lumina:lumina_test@localhost:5432/lumina_test -f db/schema.sql
      - run: npm ci --workspace @lumina/graphql-server
        working-directory: .
      # The unit tests fake the pg client, which cannot prove that Postgres
      # really delivers a NOTIFY or that a killed backend surfaces as the
      # events the reconnect supervisor listens for. These run the real thing.
      - run: npm run test:integration
        working-directory: graphql-server
        env:
          TEST_DATABASE_URL: postgresql://lumina:lumina_test@localhost:5432/lumina_test
      - run: npm ci --workspace @lumina/indexer
        working-directory: .
      # The custom-schema round trip: register, index, and read back an i128
      # through the same numeric predicate the query layer builds.
      - run: npm run test:integration
        working-directory: indexer
        env:
          TEST_DATABASE_URL: postgresql://lumina:lumina_test@localhost:5432/lumina_test

  contract:
    name: Contract (indexer ↔ GraphQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: lumina_test
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Both workspaces: the test writes through the indexer and reads through
      # the GraphQL server, so it needs the dependencies of each.
      - run: npm ci
      - run: npm run build:shared
      # Real mainnet operations, one per shape, written by indexLedger and read
      # back by every server reader of operations.details. Fails when either
      # side changes the shape the other depends on. See
      # docs/OPERATIONS_DETAILS_CONTRACT.md.
      - run: npm run test:contract
        env:
          TEST_DATABASE_URL: postgresql://lumina:lumina_test@localhost:5432/lumina_test

  chaos:
    name: Chaos (dependency failures)
    runs-on: ubuntu-latest
    # Eleven scenarios against a running stack, each with its own recovery
    # deadline; the job limit is the backstop for a scenario that hangs.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: lumina_test
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # The stack runs the built services, as their images do.
      - run: npm run build
      # The soak test's leak detector, on known series and on a process that
      # really leaks. The soak itself is too long for a pull request; it runs
      # on a schedule (soak.yml).
      - run: npm run test:soak:detector
        env:
          TEST_DATABASE_URL: postgresql://lumina:lumina_test@localhost:5432/lumina_test
      # Fails Postgres, Horizon and Soroban RPC in turn and together, and
      # requires the services to recover with nothing but their restart policy.
      # See docs/CHAOS_TESTING.md.
      - run: npm run test:chaos
        env:
          TEST_DATABASE_URL: postgresql://lumina:lumina_test@localhost:5432/lumina_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-report
          path: test/.artifacts/chaos/
          if-no-files-found: ignore
