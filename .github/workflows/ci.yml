name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  indexer:
    name: Build Indexer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --workspace @lumina/indexer
        working-directory: .
      - run: npm run lint
      - run: npm run build
      - run: npm test

  graphql-server:
    name: Build GraphQL Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphql-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --workspace @lumina/graphql-server
        working-directory: .
      - run: npm run lint
      - run: npm run schema:check
      - run: npm run build
      - run: npm test

  db-lint:
    name: Validate SQL Schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: lumina_test
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: psql postgresql://lumina:lumina_test@localhost:5432/lumina_test -f db/schema.sql

  db-schema-parity:
    name: Verify DB Schema Parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lumina_test
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Builds one database from db/schema.sql and another by replaying
      # every file in db/migrations/, then diffs the normalized dumps.
      - run: ./db/check-schema-parity.sh
        env:
          PARITY_BASE_URL: postgresql://lumina:lumina_test@localhost:5432/postgres

  subscriptions:
    name: Integration (live Postgres)
    runs-on: ubuntu-latest
    # A hung test must fail fast rather than sit until the six-hour default.
    # This job did exactly that: every test passed and the process then refused
    # to exit, because a leaked Postgres connection kept the event loop alive.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: lumina_test
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: psql postgresql://lumina:lumina_test@localhost:5432/lumina_test -f db/schema.sql
      - run: npm ci --workspace @lumina/graphql-server
        working-directory: .
      # The unit tests fake the pg client, which cannot prove that Postgres
      # really delivers a NOTIFY or that a killed backend surfaces as the
      # events the reconnect supervisor listens for. These run the real thing.
      - run: npm run test:integration
        working-directory: graphql-server
        env:
          TEST_DATABASE_URL: postgresql://lumina:lumina_test@localhost:5432/lumina_test
      - run: npm ci --workspace @lumina/indexer
        working-directory: .
      # The custom-schema round trip: register, index, and read back an i128
      # through the same numeric predicate the query layer builds.
      - run: npm run test:integration
        working-directory: indexer
        env:
          TEST_DATABASE_URL: postgresql://lumina:lumina_test@localhost:5432/lumina_test
