# Lumina on Kubernetes — the production shape. See docs/KUBERNETES.md.
#
#   kubectl apply -k deploy/kubernetes/overlays/<yours>
#
# The base deliberately contains no Secret objects and no database: credentials
# come from whatever secret store the cluster uses (docs/SECRETS.md), and
# PostgreSQL is expected to be a managed or separately operated service.
# overlays/local adds both for a throwaway cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lumina

labels:
  - pairs:
      app.kubernetes.io/part-of: lumina
    includeSelectors: false

resources:
  - namespace.yaml
  - indexer/serviceaccount.yaml
  - indexer/configmap.yaml
  - indexer/service.yaml
  - indexer/statefulset.yaml
  - graphql/serviceaccount.yaml
  - graphql/configmap.yaml
  - graphql/service.yaml
  - graphql/deployment.yaml
  - graphql/poddisruptionbudget.yaml
  - networkpolicy.yaml
  - policy/indexer-single-replica.yaml
  - backup/serviceaccount.yaml
  - backup/configmap.yaml
  - backup/cronjob-backup.yaml
  - backup/cronjob-verify.yaml

# Image names are placeholders that an overlay points at a registry, e.g.
#   images:
#     - name: lumina-indexer
#       newName: ghcr.io/<org>/lumina-indexer
#       digest: sha256:…
images:
  - name: lumina-indexer
    newTag: latest
  - name: lumina-graphql
    newTag: latest
  - name: lumina-backup
    newTag: latest
