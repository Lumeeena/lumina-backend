apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumina-backup
  labels:
    app.kubernetes.io/name: lumina-backup
    app.kubernetes.io/component: backup
# Object-storage access belongs to this identity (IRSA, GKE Workload Identity,
# Azure Workload Identity — annotate it in an overlay), not to keys in a Secret.
automountServiceAccountToken: false
