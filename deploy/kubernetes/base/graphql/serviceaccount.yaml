apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumina-graphql
  labels:
    app.kubernetes.io/name: lumina-graphql
    app.kubernetes.io/component: api
# The GraphQL server never talks to the Kubernetes API. Exports to object
# storage authenticate through the AWS SDK credential chain; on EKS that is
# IRSA or Pod Identity, configured by annotating this ServiceAccount in an
# overlay rather than by mounting keys.
automountServiceAccountToken: false
