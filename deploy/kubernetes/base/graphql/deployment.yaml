# The GraphQL server is stateless and reads only, so unlike the indexer it
# scales horizontally: any number of replicas behind one Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumina-graphql
  labels:
    app.kubernetes.io/name: lumina-graphql
    app.kubernetes.io/component: api
spec:
  replicas: 2
  # Surge rather than dip: a rollout never takes capacity below `replicas`.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: lumina-graphql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumina-graphql
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: lumina-graphql
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # `node` in node:20-alpine
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Prefer replicas on different nodes, without refusing to schedule on a
      # single-node cluster.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lumina-graphql
      containers:
        - name: graphql
          image: lumina-graphql
          envFrom:
            - configMapRef:
                name: lumina-graphql
          ports:
            - name: http
              containerPort: 4000
          # startupProbe and livenessProbe use /live, which answers whenever
          # the process is serving HTTP and checks nothing else. readinessProbe
          # uses /health, which runs a real query: a replica that cannot reach
          # Postgres leaves the Service's endpoints instead of being restarted.
          # Restarting every replica during a database outage repairs nothing
          # and stampedes the database with reconnects when it returns.
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Endpoint removal and SIGTERM race: kube-proxy and ingress
            # controllers can still send a terminating pod new requests for a
            # few seconds. Waiting before the server starts draining lets them
            # catch up, so a rollout does not drop requests.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: database-credentials
              mountPath: /var/run/secrets/lumina/database
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: database-credentials
          secret:
            secretName: lumina-graphql-db
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
